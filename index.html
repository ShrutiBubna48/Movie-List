<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Movie</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href="index.css">
</head>

<body>
    <div class="container">
        <h1><img src="movie icon.jpeg" height="100px" width="100px"> Add a movie</h1>
        <div class="content">
            Movie Name:
            <input type="text" id="name" &nbps>
            <button id="add"><b>Add Movie</b></button><br>
            <div class="button">
                <button id="show"><b>Show List</b></button>
                <button id="clear"><b>Clear List</b></button>
            </div>
            <div class="display">
                <p>Total Movies: <strong id="movie-count">0</strong></p>
                <ul id="list">

                </ul>

            </div>
        </div>
    </div>
    <script src='index.js'></script>
</body>


</html>
